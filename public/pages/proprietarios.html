<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAki - Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../components/style.css">
</head>
<body>
  <div id="sidebar-container">
    <div class="sidebar-loading">Carregando...</div>
  </div>

  <div class="page-container">
    <main class="main-principal">

        <div class="breadcrumb">
          <a href="#">Proprietários</a>
          <i class="fas fa-chevron-right"></i>
          <span>Listar</span>
        </div>

        <div class="page-header">
          <h1>Proprietários</h1>
          <a href="novoProprietario.html" class="btn-criar">
            <i class="fas fa-plus"></i>
            Novo Proprietário
          </a>
        </div>

        <div class="tabela-container">
          <div class="toolbar">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" placeholder="Pesquisar">
            </div>

            <div class="toolbar-actions">
              <button class="filter-btn">
                <i class="fas fa-filter"></i>
                <span class="filter-count">0</span>
              </button>
              <button class="view-btn">
                <i class="fas fa-th-large"></i>
              </button>
            </div>
          </div>

          <div class="empty-state">
            <div class="empty-icon">
              <i class="fas fa-times"></i>
            </div>
            <h3>Sem registros</h3>
            <p>Não há proprietários cadastrados no momento. Clique em "Novo Proprietário" para adicionar o primeiro.</p>
          </div>

        </div>
    </main>
  </div>

  <script src="../assets/js/sidebar-loader.js"></script>
  <script src="../assets/js/dark-mode.js"></script>

</body>
</html>
