<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAki - Inventários</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div id="sidebar-container">
    <div class="sidebar-loading">Carregando...</div>
  </div>
  
  <div class="page-container">
    <main class="main-principal">
      <div class="breadcrumb">
        <a href="#">Inventários</a>
        <i class="fas fa-chevron-right"></i>
        <span>Listar</span>
      </div>

      <div class="page-header">
        <h1>Inventários</h1>
        <a href="novoInventario.html" class="btn-criar">
          <i class="fas fa-plus"></i>
          Novo Inventário
        </a>
      </div>

      <div class="tabela-container">
        <div class="toolbar">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Pesquisar inventário...">
          </div>
          <div class="toolbar-actions">
            <button class="filter-btn">
              <i class="fas fa-filter"></i>
              <span class="filter-count">0</span>
            </button>
            <button class="view-btn">
              <i class="fas fa-th-large"></i>
            </button>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th><input type="checkbox"></th>
                <th>Identificação <i class="fas fa-chevron-down"></i></th>
                <th>Propriedade</th>
                <th>Endereço</th>
                <th>Data de Criação <i class="fas fa-chevron-down"></i></th>
                <th>Status <i class="fas fa-chevron-down"></i></th>
                <th>Ações</th>
              </tr>
            </thead>
            
            <tbody>
              <tr>
                <td><input type="checkbox"></td>
                <td>INV-2024-002</td>
                <td>Apto 32B</td>
                <td>Av. Paulista, 1000, Bela Vista</td>
                <td>20/01/2024</td>
                <td>
                  <span class="badge badge-danger">Pendente</span>
                </td>
                <td class="table-actions">

                  <div class="dropdown">
                    <button class="btn-modelo" onclick="openAnyDropdown(this, 'modelo', event)">
                      Modelo <i class="fas fa-chevron-down"></i>
                    </button>
                    
                
                    <div class="dropdown-menu">
                      <button>
                        <i class="fas fa-download"></i>
                        Baixar inventário da propriedade
                      </button>
                    </div>
                  </div>
                
                  <div class="dropdown">
                    <button class="btn-acoes" onclick="openAnyDropdown(this, 'acoes', event)">
                      <i class="fas fa-ellipsis-h"></i>
                    </button>
                    
                  
                    <div class="dropdown-menu dropdown-fixed">
                      <button><i class="fas fa-pen"></i> Editar</button>
                      <button><i class="fas fa-archive"></i> Arquivar</button>
                      <button><i class="fas fa-copy"></i> Duplicar</button>
                      <button><i class="fas fa-file-alt"></i> Transferência para Laudo de Vistoria</button>
                      <button class="danger"><i class="fas fa-trash"></i> Excluir</button>
                    </div>
                  </div>
                  
                
                </td>
                
                
              </tr>
            </tbody>
          </table>
          
          <div class="table-footer">
            <span>Exibindo 2 resultados</span>
            
            <div class="select-page">
              <label>por página</label>
              <select>
                <option>10</option>
                <option>20</option>
                <option>50</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/sidebar-loader.js"></script>
  <script src="/assets/js/dark-mode.js"></script>
  <script src="/assets/js/acoes-dropdown.js"></script>
  
  

    
</body>
</html>
