<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Empresa - AlugAki</title>
    <link rel="stylesheet" href="../assets/css/criar-empresa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    

</head>

    
    
<body>        
<div class="container-cadastro">
    
    <aside class="sidebar-steps">
                <div class="logo">
            <div class="logo-icon">
              <img src="../assets/image/icone-logo.png" class="logo-icone-img">
            </div>
            <div class="logo-text">
              <img src="../assets/image/escrita-logo.png" class="logo-escrita-img">
            </div>
          </div>
        <ul class="steps-list">
            <li class="active">
                <span class="circle">1</span> Tipo De Usuario
            </li>
            <li>
                <span class="circle">2</span> Informações
            </li>
            <li>
                <span class="circle">3</span> Endereço
            </li>
            <li>
                <span class="circle">4</span> Finalizar
            </li>
        </ul>
    </aside>

    <!-- ========== FORMULÁRIO PRINCIPAL ========== -->
    <main class="content">

        <h1>Tipo De Usuario</h1>
        <p class="descricao">Informe qual o tipo do seu usuario para fazer o cadastro</p>

        <form class="formulario">
            <div class="tipo-usuario-container">

                <label class="tipo-opcao">
                    <input type="radio" name="tipo_usuario" value="pf">
                    <div class="option-box">
                        <i class="fa-solid fa-user"></i>
                        <span>Pessoa Física</span>
                    </div>
                </label>
            
                <label class="tipo-opcao">
                    <input type="radio" name="tipo_usuario" value="pj">
                    <div class="option-box">
                        <i class="fa-solid fa-building"></i>
                        <span>Pessoa Jurídica</span>
                    </div>
                </label>
            
            </div>
            <button class="btn-proximo">Próximo</button>
        </form>
    </main>

</div>

</body>
</html>
