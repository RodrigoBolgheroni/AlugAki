<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AlugAki</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
    <main class="main-login">
        <div class="div-login">
            <div class="login-box">
                <img src="../assets/image/logo.png" alt="Logo AlugAki" class="logo-login">

                <h2 class="titulo-login">Faça login</h2>

                <form class="form-login" action="/pages/dashboard/home.html">
                    <label for="email" class="label-login">E-mail<span>*</span></label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    <div class="campo-senha">
                        <label for="senha" class="label-login">Senha<span>*</span></label>
                        <a href="/pages/auth/recuperarSenha.html" class="link-esqueci">Esqueceu sua senha?</a>
                    </div>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                    <div class="lembrar">
                        <label class="checkbox-wrapper">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                        </label>
                        <label for="lembrar">Lembre de mim</label>
                    </div>

                    <button type="submit" class="btn-login">Login</button>

                    <div class="ou-container">
                        <span class="linha"></span>
                        <p>ou</p>
                        <span class="linha"></span>
                    </div>

                    <button type="button" class="btn-google">
                        <img src="../assets/image/google-icon.svg" alt="Google" class="google-icon">
                        Entrar com Google
                    </button>

                    <button type="button" class="btn-secundario">SEGUNDA-VIA DA FATURA</button>
                    <p class="subtitulo-login">
                        <a href="/pages/auth/cadastro.html" class="link-criar-conta">Criar uma conta</a>
                    </p>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
