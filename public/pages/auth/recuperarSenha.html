<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - AlugAki</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
    <main class="main-login">
        <div class="div-login">
            <div class="login-box">
                <img src="/assets/image/logo.png" alt="Logo AlugAki" class="logo-login">

                <h2 class="titulo-login">Recuperar senha</h2>
                <p class="subtitulo-login">Informe seu e-mail para receber o link de redefinição.</p>

                <form class="form-login" action="#" method="POST">
                    <label for="email" class="label-login">E-mail <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    <button type="submit" class="btn-login">Enviar link</button>

                    <button type="button" class="btn-secundario" onclick="window.location.href='../index.html'">Voltar ao login</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
