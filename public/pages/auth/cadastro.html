<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AlugAki</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
    <main class="main-login">
        <div class="div-login">
            <div class="login-box">
                <img src="/assets/image/logo.png" alt="Logo AlugAki" class="logo-login">

                <h2 class="titulo-login">Cadastro</h2>

                <form class="form-login" action="#" method="POST">
                    <label for="nome" class="label-login">Nome<span>*</span></label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>


                    <label for="email" class="label-login">E-mail<span>*</span></label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    <label for="cpf" class="label-login">CPF<span>*</span></label>
                    <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required>

                    <label for="telefone" class="label-login">Telefone celular<span>*</span></label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

                    <label for="senha" class="label-login">Senha<span>*</span></label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                    <label for="confirmar" class="label-login">Confirmar senha<span>*</span></label>
                    <input type="password" id="confirmar" name="confirmar" placeholder="Repita sua senha" required>
                    <button type="submit" class="btn-login">Criar Conta</button>
                    
                    <div class="ou-container">
                        <span class="linha"></span>
                        <p>ou</p>
                        <span class="linha"></span>
                    </div>

                    <button type="button" class="btn-google">
                        <img src="/assets/image/google-icon.svg" alt="Google" class="google-icon">
                        Entrar com Google
                    </button>
                    <p class="subtitulo-login">
                        <a href="../index.html" class="link-criar-conta">Fazer Login</a>
                    </p>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
