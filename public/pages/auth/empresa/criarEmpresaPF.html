<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Empresa - AlugAki</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>

<body class="body-empresa">
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const inputFile = document.getElementById("logo-upload");
            const previewImg = document.getElementById("preview");
        
            inputFile.addEventListener("change", () => {
                const file = inputFile.files[0];
                if (!file) return;
        
                previewImg.src = URL.createObjectURL(file);
            });
        });
        </script>
<div class="container-cadastro">

    <aside class="sidebar-steps">
        <div class="logo-empresa-login">
            <div class="logo-icon">
              <img src="/assets/image/icone-logo.png" class="logo-icone-img">
            </div>
            <div class="logo-text">
              <img src="/assets/image/escrita-logo.png" class="logo-escrita-img">
            </div>
          </div>

        <ul class="steps-list">
            <li>
                <span class="circle">1</span> Tipo De Usuario
            </li>
            <li class="active">
                <span class="circle">2</span> Informações
            </li>
            <li>
                <span class="circle">3</span> Endereço
            </li>
            <li>
                <span class="circle">4</span> Finalizar
            </li>
        </ul>
    </aside>

    <!-- ========== FORMULÁRIO PRINCIPAL ========== -->
    <main class="content">
        <div style="display: flex;gap: 60px;align-items: center;margin-bottom: 20px;">
            <div class="upload-wrapper">
                <label for="logo-upload" class="upload-area">
                    
                    <div class="upload-text" id="upload-text">
                        Arraste e solte<br>
                        os arquivos ou<br>
                        <strong class="clique-aqui">Clique aqui</strong>
                    </div>
            
                    <img id="preview" class="preview-img" style="display: none;">
                    
                    <input type="file" id="logo-upload" accept="image/*" hidden>
                </label>
            </div>
                 
            <div>
                <h1>Informações Pessoais</h1>
                <p class="descricao">Preencha os campos para criar sua conta.</p>
            </div>
         </div>
        <form class="formulario">
            <div class="campo-duplo">
                <div class="campo">
                    <label>Nome completo <span>*</span></label>
                    <input type="text" placeholder="Digite seu nome" required>
                </div>
                <div class="campo">
                    <label>E-mail <span>*</span></label>
                    <input type="email" placeholder="Digite seu e-mail" required>
                </div>
            </div>


            <div class="campo-duplo">
                <div class="campo">
                    <label>CPF <span>*</span></label>
                    <input type="text" placeholder="000.000.000-00" required>
                </div>
                <div class="campo">
                    <label>Telefone celular <span>*</span></label>
                    <input type="tel" placeholder="(00) 00000-0000" required>
                </div>
            </div>

            <div class="campo-duplo">

                <div class="campo">
                    <label>Área de atuação <span>*</span></label>
                    <select required>
                        <option value="proprietario">Corretor</option>
                        <option value="proprietario">Proprietário De Imoveis</option>
                        <option value="inquilino">Imobiliária</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Nº de imóveis administrados <span>*</span></label>
                    <input type="number" required>
                </div>
            </div>


            <button class="btn-proximo">Próximo</button>

        </form>
    </main>

</div>

</body>
</html>
