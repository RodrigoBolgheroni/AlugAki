<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAki - Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../modals/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      min-height: 100vh;
      background: #f5f5f5;
    }

    /* ==== SIDEBAR ==== */
    #sidebar-container {
      width: 320px;
      flex-shrink: 0;
      z-index: 10;
    }

    .sidebar-loading {
      width: 320px;
      height: 100vh;
      background: #252525;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #A8A8A8;
    }

    /* ==== CONTAINER PRINCIPAL ==== */
    .page-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ==== HEADER SUPERIOR ==== */
    header {
      height: 70px;
      background: #252525;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      color: #fff;
      z-index: 5;
    }

    header .search-bar {
      display: flex;
      align-items: center;
      background: #333;
      padding: 6px 12px;
      border-radius: 8px;
      width: 350px;
    }

    header .search-bar input {
      border: none;
      outline: none;
      background: transparent;
      color: #fff;
      width: 100%;
      margin-left: 8px;
      font-size: 14px;
    }

    header .icons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    header .icons i {
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    header .icons i:hover {
      color: #F2C94C;
    }

    header .user {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #333;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    header .user img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* ==== CONTEÚDO PRINCIPAL ==== */
    main {
      flex: 1;
      background: #fff;
      margin-top: 1px;
      border-radius: 25px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow-y: auto;
      z-index: 100;
    }

    main h1 {
      color: #252525;
      margin-bottom: 20px;
    }

  </style>
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar-container">
    <div class="sidebar-loading">Carregando...</div>
  </div>

  <!-- Conteúdo principal -->
  <div class="page-container">
    <!-- Header -->
    <header>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Buscar...">
      </div>

      <div class="icons">
        <i class="fas fa-bell"></i>
        <div class="user">
          <img alt="User">
          <span>Rodrigo</span>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main>
      <h1>Dashboard</h1>
      <p>Conteúdo principal aqui.</p>
      <p>Mais conteúdo de teste.</p>
    </main>
  </div>

  <script src="../assets/js/sidebar-loader.js"></script>
</body>
</html>
